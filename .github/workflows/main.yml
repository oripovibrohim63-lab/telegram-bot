name: Telegram bot auto-restart

'on':
  workflow_dispatch:
  push:
    branches:
      - main
  # Re-start the bot periodically before GitHub's 6-hour job limit.
  schedule:
    - cron: '0 */5 * * *'

# A scheduled/manual/push run replaces the older bot run.
concurrency:
  group: telegram-bot-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Kodni yuklash
        uses: actions/checkout@v4

      - name: Python o‘rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kutubxonalarni o‘rnatish
        run: |
          python -m pip install --upgrade pip
          pip install python-telegram-bot google-genai requests

      - name: Botni xato bo‘lsa qayta ishga tushirish
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          while true; do
            echo "Bot ishga tushirilmoqda: $(date -u)"
            if python -u main.py; then
              echo "Bot jarayoni to‘xtadi. 30 soniyadan keyin qayta ishga tushadi."
            else
              code=$?
              echo "Bot xato bilan to‘xtadi (exit code: $code). 30 soniyadan keyin qayta urinish."
            fi
            sleep 30
          done
