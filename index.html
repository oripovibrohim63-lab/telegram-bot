
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smile Music</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #111, #343434);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .player { padding: 28px; }
    button {
      padding: 14px 28px;
      border: 0;
      border-radius: 30px;
      background: #f0a030;
      font-size: 17px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="player">
    <h1>🎵 Smile</h1>
    <p>The Crystal Method</p>
    <p>Qo‘shiqni tinglash uchun tugmani bosing</p>
    <button id="play">▶ Tinglash</button>
    <audio id="music" preload="none"
      src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
    </audio>
  </div>

  <script>
    const music = document.getElementById("music");
    document.getElementById("play").onclick = async () => {
      try {
        await music.play();
        document.getElementById("play").textContent = "⏸ Pauza";
      } catch (e) {
        alert("Musiqani ijro etib bo‘lmadi.");
      }
    };
  </script>
</body>
</html>
